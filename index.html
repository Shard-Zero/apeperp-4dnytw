<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="./favicon.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./favicon.webp" />

  <title>Shard DEX</title>
  <script>
    (function () {
      // ShardZero Footer Fix v2.0 (DOM Enforcer)
      // This observer handles cases where React/CSS changes are overridden or ignored.
      const observer = new MutationObserver(() => {
        // Target specific SVG by unique viewbox found in user report
        // <svg ... viewBox="0 0 45 14" ... >
        const badSvgs = document.querySelectorAll('footer svg[viewBox="0 0 45 14"]');
        badSvgs.forEach(svg => {
          if (svg.style.display !== 'none') {
            svg.style.display = 'none';
            // Also hide parent if it looks like the logo wrapper (often a link or div)
            // Optional: svg.parentElement.style.display = 'none';
          }
        });
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./app/main.tsx"></script>
</body>

</html>
